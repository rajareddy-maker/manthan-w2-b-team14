repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/black
        language: system
        types: [python]
      - id: sqlfluff
        name: sqlfluff
        entry: .venv/bin/sqlfluff lint
        language: system
        files: ^dbt_project/(models|tests|macros)/.*\.sql$
      - id: no-env-file
        name: never commit .env
        entry: bash -c 'git diff --cached --name-only | grep -qx ".env" && { echo ".env must not be committed"; exit 1; } || exit 0'
        language: system
        pass_filenames: false

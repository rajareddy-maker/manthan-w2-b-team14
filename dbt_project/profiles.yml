gridpulse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse/gridpulse.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "1500MB"
        timezone: "Asia/Kolkata"
    ci:
      type: duckdb
      path: ":memory:"
      threads: 2
      settings:
        timezone: "Asia/Kolkata"
